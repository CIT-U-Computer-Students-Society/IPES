name: PR Validation

on:
  pull_request:
    branches:
      - dev
      - main
      - 'docs/testing-*'
      - 'ci/postgresql-test-*'
      - 'test/backend-e2e-*'
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-sync-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test branch sync automation
        run: node --test .github/scripts/sync-dev-with-main.test.cjs

  validate-python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: ipes_test_bootstrap
          POSTGRES_PASSWORD: ipes_test_bootstrap_local
          POSTGRES_DB: ipes_test_control
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U ipes_test_bootstrap -d ipes_test_control"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Initialize isolated PostgreSQL test role
        working-directory: backend
        env:
          IPES_TEST_BOOTSTRAP_PASSWORD: ipes_test_bootstrap_local
        run: python scripts/test_database.py bootstrap

      - name: Lint with flake8
        run: flake8 backend
        continue-on-error: true

      - name: Test backend with PostgreSQL and branch coverage
        working-directory: ./backend
        run: python -m coverage run --context=backend-tests manage.py test --noinput

      - name: Generate backend coverage reports
        if: always()
        working-directory: backend
        run: |
          python -m coverage html
          python -m coverage xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-coverage
          path: backend/coverage/unit/
          retention-days: 14
          if-no-files-found: error

  validate-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: |
          npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-unit-coverage
          path: frontend/coverage/unit/
          retention-days: 14
          if-no-files-found: error
