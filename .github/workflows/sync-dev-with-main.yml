name: Sync dev with main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sync-dev-with-main
  cancel-in-progress: false

jobs:
  open-sync-pr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Open or reuse sync PR
        uses: actions/github-script@v8
        with:
          # An optional app/PAT token allows PR validation to run without approval.
          github-token: ${{ secrets.DEV_SYNC_TOKEN || github.token }}
          script: |
            const sync = require('./.github/scripts/sync-dev-with-main.cjs');
            await sync({ github, context, core });
