name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-prs:
    needs: publish-releases
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Prepare combined component release PR
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN_IPES_CSS2627 || secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  publish-releases:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout production history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish component releases merged into main
        uses: actions/github-script@v9
        with:
          # Uses configured release PAT (with workflow scope) or falls back to GITHUB_TOKEN.
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN_IPES_CSS2627 || secrets.RELEASE_PLEASE_TOKEN || github.token }}
          script: |
            const publish = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-releases.cjs`);
            await publish({ github, context, core });
