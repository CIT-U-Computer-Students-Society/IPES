name: Enforce Main Target Rules

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  check-branch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch for main target
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const sameRepo = pr.head.repo?.full_name === pr.base.repo.full_name;
            const allowed = sameRepo && (
              pr.head.ref === 'dev' ||
              pr.head.ref === 'release-please--branches--main'
            );
            if (!allowed) {
              core.setFailed('Main accepts only dev promotion PRs or the combined Release Please PR from this repository.');
            } else {
              core.info('Branch check passed.');
            }
