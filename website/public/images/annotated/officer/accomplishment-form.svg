<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" style="background:#f8fafc; border-radius:12px; font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <marker id="arrow-amber-lm3" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-violet-lm3" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6" />
    </marker>
  </defs>

  <!-- Dimmed Light Backdrop -->
  <rect x="0" y="0" width="880" height="500" fill="#0f172a" opacity="0.25"/>

  <!-- Centered Modal Box in Light Mode -->
  <rect x="140" y="30" width="600" height="440" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0 20px 25px rgba(15,23,42,0.15))"/>
  <text x="175" y="68" font-size="18" font-weight="700" fill="#293f55" font-family="'Montserrat', sans-serif">Log New Accomplishment</text>
  <text x="175" y="88" font-size="12" fill="#64748b">Document term achievements for peer and admin evaluation review</text>

  <!-- Field 1: Title -->
  <text x="175" y="122" font-size="12" font-weight="600" fill="#334155">Accomplishment Title *</text>
  <rect x="175" y="132" width="530" height="36" rx="6" fill="#f8fafc" stroke="#8b5cf6" stroke-width="2"/>
  <text x="190" y="155" font-size="13" fill="#0f172a">CIT-U Research Colloquium Presentation</text>

  <!-- Field 2: Category & Date -->
  <text x="175" y="192" font-size="12" font-weight="600" fill="#334155">Category</text>
  <rect x="175" y="202" width="250" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="190" y="225" font-size="13" fill="#334155">Project Leadership &amp; Delivery</text>

  <text x="455" y="192" font-size="12" font-weight="600" fill="#334155">Date Range</text>
  <rect x="455" y="202" width="250" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="470" y="225" font-size="13" fill="#334155">Sep 01 - Sep 30, 2026</text>

  <!-- Field 3: Proof URL (Highlighted Amber) -->
  <text x="175" y="265" font-size="12" font-weight="700" fill="#b45309">Verification Proof Link (Google Drive / Published Link) *</text>
  <rect x="175" y="275" width="530" height="38" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="190" y="299" font-size="13" fill="#0284c7">https://drive.google.com/drive/folders/1aBcDeFgHiJkLmNoPq...</text>

  <!-- Field 4: Description -->
  <text x="175" y="338" font-size="12" font-weight="600" fill="#334155">Contribution Summary</text>
  <rect x="175" y="348" width="530" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="190" y="372" font-size="12" fill="#64748b">Led presentation of our committee's survey findings to university faculty...</text>

  <!-- Action Buttons -->
  <rect x="465" y="415" width="100" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="495" y="439" font-size="13" font-weight="600" fill="#475569">Cancel</text>

  <rect id="btn-submit" x="580" y="415" width="125" height="38" rx="6" fill="#293f55"/>
  <text x="600" y="439" font-size="13" font-weight="700" fill="#ffffff">Submit Proof</text>

  <!-- ================= Annotations ================= -->
  <!-- Callout 1: Points to Accomplishment Title -->
  <circle cx="745" cy="150" r="14" fill="#8b5cf6"/>
  <text x="740" y="155" font-size="14" font-weight="800" fill="#ffffff">1</text>
  <path d="M 728 150 L 708 150" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrow-violet-lm3)"/>

  <!-- Callout 2: Points to Proof Link -->
  <circle cx="745" cy="294" r="14" fill="#f59e0b"/>
  <text x="740" y="299" font-size="14" font-weight="800" fill="#ffffff">2</text>
  <path d="M 728 294 L 708 294" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber-lm3)"/>
  <rect x="735" y="255" width="115" height="24" rx="6" fill="#f59e0b"/>
  <text x="743" y="271" font-size="10" font-weight="700" fill="#ffffff">Public View Link</text>

  <!-- Callout 3: Points to Submit Button -->
  <circle cx="745" cy="434" r="14" fill="#8b5cf6"/>
  <text x="740" y="439" font-size="14" font-weight="800" fill="#ffffff">3</text>
  <path d="M 728 434 L 708 434" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrow-violet-lm3)"/>
</svg>
